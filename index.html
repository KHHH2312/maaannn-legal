<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maaannn - Discord Application</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1a1d26;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --border: #2d3348;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 580px;
      width: 100%;
      padding: 2.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }
    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background: var(--accent-hover);
    }
    .btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn.secondary:hover {
      background: var(--border);
    }
    footer {
      margin-top: 2rem;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Maaannn</h1>
    <p class="subtitle">Official Discord Application legal documentation</p>
    <div class="links">
      <a href="./terms/" class="btn">Terms of Service</a>
      <a href="./privacy/" class="btn secondary">Privacy Policy</a>
    </div>
  </div>
  <footer>
    &copy; 2026 team man. All rights reserved.
  </footer>
</body>
</html>
